<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Chess against a C++ engine compiled to WebAssembly. No server, no accounts.">
<meta name="theme-color" content="#0c0e13">
<title>Gambit — WebAssembly Chess</title>
<link rel="stylesheet" href="/css/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 45 45'%3E%3Cpath fill='%23c9a227' d='M10.6 18.6C12.4 14.6 15.2 11.4 17.4 9c-.4-1.8.2-3.8 1.2-4.6 1 1 1.4 2.6 1.6 4 1.2-1.8 2.6-3 4-3.4.8 2 .6 4 .2 5.4 3 2.6 5.2 6.2 5.6 11 .4 3.6 0 5.8-.4 8.2H15.4c-.4-3.2.2-5.6 1.2-7.6-1.6.6-3.2.4-4.2-.4-.8-.6-1.6-1.6-1.8-3zM11.6 31h21.8v3.6H11.6z'/%3E%3C/svg%3E">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 45 45" aria-hidden="true">
        <path d="M10.6 18.6C12.4 14.6 15.2 11.4 17.4 9c-.4-1.8.2-3.8 1.2-4.6 1 1 1.4 2.6 1.6 4 1.2-1.8 2.6-3 4-3.4.8 2 .6 4 .2 5.4 3 2.6 5.2 6.2 5.6 11 .4 3.6 0 5.8-.4 8.2H15.4c-.4-3.2.2-5.6 1.2-7.6-1.6.6-3.2.4-4.2-.4-.8-.6-1.6-1.6-1.8-3z"/>
        <rect x="11.6" y="30.6" width="21.8" height="3.6" rx="1.6"/>
      </svg>
      <div class="brand-text">
        <strong>GAMBIT</strong>
        <span>C++ engine · WebAssembly</span>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="btn-sound" class="icon-btn" type="button" aria-pressed="true" title="Sound on/off">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ic-sound-on"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ic-sound-off"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>
        <span class="sr-only">Toggle sound</span>
      </button>
      <button id="btn-amb" class="icon-btn" type="button" aria-pressed="true" title="Ambience on/off">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ic-amb-on"><circle cx="7.2" cy="16.4" r="2.5"/><circle cx="16.6" cy="14.4" r="2.5"/><path class="wave" d="M9.7 16.4V6.3l9.4-2v10.1"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ic-amb-off"><circle cx="7.2" cy="16.4" r="2.5"/><path class="wave" d="M9.7 16.4V6.3l9.4-2v3.4M4.5 4.5l15 15"/></svg>
        <span class="sr-only">Toggle ambience</span>
      </button>
      <button id="btn-theme" class="icon-btn" type="button" title="Light/dark theme">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ic-moon"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ic-sun"><circle cx="12" cy="12" r="4.2"/><path class="rays" d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></svg>
        <span class="sr-only">Toggle theme</span>
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="board-area">
      <div class="player-strip" id="strip-top">
        <span class="dot"></span>
        <span class="pname">Black</span>
        <span class="tray" id="tray-black"></span>
        <span class="material" id="mat-black"></span>
        <span class="thinking-tag" hidden>thinking<i></i><i></i><i></i></span>
        <span class="clock" id="clock-black" hidden></span>
      </div>

      <div class="board-frame">
        <div class="board" id="board">
          <div class="squares"></div>
          <div class="markers"></div>
          <div class="pieces"></div>
          <div class="coords"></div>
        </div>

        <div class="overlay" id="overlay" hidden>
          <div class="result-card">
            <div class="result-icon" id="result-icon"></div>
            <h2 id="result-title">Checkmate</h2>
            <p id="result-sub">White wins</p>
            <button class="btn primary" id="btn-rematch" type="button">New game</button>
          </div>
        </div>

        <div class="promo" id="promo" hidden>
          <div class="promo-card">
            <p>Promote to</p>
            <div class="promo-choices" id="promo-choices"></div>
          </div>
        </div>
      </div>

      <div class="player-strip" id="strip-bottom">
        <span class="dot"></span>
        <span class="pname">White</span>
        <span class="tray" id="tray-white"></span>
        <span class="material" id="mat-white"></span>
        <span class="thinking-tag" hidden>thinking<i></i><i></i><i></i></span>
        <span class="clock" id="clock-white" hidden></span>
      </div>
    </section>

    <aside class="panel">
      <div class="status" id="status" aria-live="polite">
        <span class="turn-dot" id="turn-dot"></span>
        <span id="status-text">White to move</span>
      </div>

      <div class="field">
        <span class="label">Opponent</span>
        <div class="segmented" id="mode" role="group" aria-label="Game mode">
          <button type="button" data-mode="ai" class="on">Computer</button>
          <button type="button" data-mode="pvp">Two players</button>
          <button type="button" data-mode="online">Online</button>
        </div>
      </div>

      <div class="field" id="field-online" hidden>
        <span class="label">Online room</span>

        <div class="online-lobby" id="online-lobby">
          <select id="tc" class="tc-select" aria-label="Time control"></select>
          <button class="btn primary" id="btn-create" type="button">Create game</button>
          <div class="join-row">
            <input id="join-code" class="code-input" type="text" maxlength="6" placeholder="CODE"
                   autocomplete="off" autocapitalize="characters" spellcheck="false"
                   aria-label="Room code to join">
            <button class="btn" id="btn-join" type="button">Join</button>
          </div>
        </div>

        <div class="online-room" id="online-room" hidden>
          <button class="room-code" id="room-code" type="button" title="Copy room code">
            <span id="room-code-text"></span>
            <span class="copy-hint" id="room-code-hint">copy</span>
          </button>
          <p class="online-you" id="online-you"></p>
          <p class="online-conn" id="online-conn" role="status" hidden></p>
          <button class="btn" id="btn-leave" type="button">Leave room</button>
        </div>

        <p class="online-note" id="online-note" role="status" hidden></p>
      </div>

      <div class="field" id="field-level">
        <span class="label">Strength</span>
        <div class="segmented small" id="level" role="group" aria-label="Computer strength"></div>
      </div>

      <div class="field" id="field-side">
        <span class="label">You play</span>
        <div class="segmented" id="side" role="group" aria-label="Your colour">
          <button type="button" data-side="w" class="on">White</button>
          <button type="button" data-side="b">Black</button>
        </div>
      </div>

      <div class="moves">
        <div class="moves-head">
          <span class="label">Moves</span>
          <span class="eval" id="eval"></span>
        </div>
        <ol class="movelist" id="movelist"></ol>
      </div>

      <div class="actions">
        <button class="btn" id="btn-undo" type="button">Undo</button>
        <button class="btn" id="btn-flip" type="button">Flip</button>
        <button class="btn primary" id="btn-new" type="button">New game</button>
      </div>
    </aside>
  </main>

  <div class="boot" id="boot"><span class="spinner"></span> Loading engine…</div>
</div>

<script>
  // The boot screen is removed by app.js; surface the reason if it never runs.
  addEventListener('error', (ev) => {
    const boot = document.getElementById('boot');
    if (boot) boot.innerHTML = `<span>Failed to load the engine: ${ev.message || ev.type}</span>`;
  });
</script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
